<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 GW of Blackwell: the returns, at a glance</title>
<style>
:root{
  --bg:#f6f6f3;--panel:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--ink3:#8a8985;--line:#e4e3df;--line2:#d2d1cc;--chip:#efeeea;
  --rent:#2a78d6;--lab:#eb6834;--open:#1baf7a;--aws:#4a3aa7;
  --market:#008300;--market-bg:#f1f8ee;--assump:#e34948;--assump-bg:#fff2f1;--fixed:#8a8985;--fixed-bg:#f4f4f1;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.15}
h2{font-size:22px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600}
p{margin:0}
.muted{color:var(--ink2)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(246,246,243,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1400px;margin:0 auto;padding:9px 28px;display:flex;align-items:center;gap:14px;flex-wrap:nowrap}
@media (max-width:1180px){.top .in{flex-wrap:wrap}.brand span{display:none}}
.brand{font-weight:650;font-size:15px;white-space:nowrap}
.brand span{color:var(--ink3);font-weight:500;margin-left:8px}
.tabs{display:flex;gap:4px;flex-wrap:nowrap}
@media (max-width:1180px){.tabs{flex-wrap:wrap}}
@media (max-width:1320px){.brand span{display:none}}
.tab{border:1px solid transparent;background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink2);font-size:13.5px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink3))}
.tab:hover{background:#ecebe7;color:var(--ink)}
.tab.on{background:#ffffff;border-color:var(--line2);color:var(--ink);box-shadow:var(--shadow)}
.tab b{font-weight:650}
.legend{margin-left:auto;display:flex;gap:5px;align-items:center;font-size:12px;color:var(--ink2);flex-wrap:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.pill.market{background:var(--market-bg);color:var(--market);border:1px solid #bfe0b3}
.pill.assumption{background:var(--assump-bg);color:#b8322f;border:1px solid #f3bcb9}
.pill.fixed{background:var(--fixed-bg);color:var(--ink2);border:1px solid var(--line2)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* ---------- live strip ---------- */
.live{max-width:1400px;margin:10px auto 0;padding:8px 14px;border-radius:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink2);border:1px solid var(--line);background:#fff}
.live.on{border-color:#bfe0b3;background:#f4faf1}
.live .dotl{width:9px;height:9px;border-radius:50%;background:#b5b4ae;flex:none}
.live.on .dotl{background:var(--market);box-shadow:0 0 0 3px #d5ecd0}
.live b{color:var(--ink)}
.live a{color:var(--ink2)}
.live .diffs{display:flex;gap:6px;flex-wrap:wrap}
.live .diff{background:var(--assump-bg);color:#9c2a27;border:1px solid #f3bcb9;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.live .warn{color:#8a4b00;background:#fbe9c8;border-radius:999px;padding:2px 9px;font-size:12px}
.live .tvtoggle{margin-left:auto}
@media (max-width:1456px){.live{margin-left:28px;margin-right:28px}}

/* ---------- sections ---------- */
main{max-width:1400px;margin:0 auto;padding:0 28px 40px}
section.page{display:none;padding:34px 0 24px;min-height:calc(100vh - 58px)}
section.page.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.phead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:start;margin-bottom:26px}
@media (max-width:1200px){.phead{grid-template-columns:1fr}}
.phead .t{max-width:760px}
.letter{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;color:#fff;font-weight:700;font-size:17px;background:var(--c);margin-right:12px;vertical-align:middle}
.what{margin-top:8px;color:var(--ink2);font-size:16px}
.heroes{display:flex;gap:14px;flex-wrap:wrap}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 22px 14px;min-width:190px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.hero .l{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600}
.hero .v{font-size:44px;font-weight:650;line-height:1.05;margin:6px 0 4px;letter-spacing:-.02em}
.hero .s{font-size:12.5px;color:var(--ink2)}
.stats{display:flex;gap:22px;flex-wrap:wrap;padding:6px 0 0}
.stat .l{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat .v{font-size:20px;font-weight:600;margin-top:2px}

/* ---------- driver chain ---------- */
.block{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px}
.block h3{margin-bottom:14px}
.chain{display:flex;align-items:stretch;gap:10px;flex-wrap:nowrap}
.chain+.chain{margin-top:12px}
@media (max-width:1000px){.chain{flex-wrap:wrap}}
.op{align-self:center;width:30px;height:30px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink2);font-size:18px;flex:none}
.op.eq{background:transparent;font-size:22px;width:24px}
.box{flex:1 1 0;min-width:0;border:1.5px solid var(--line2);background:#fff;border-radius:14px;padding:10px 14px 12px;position:relative;cursor:pointer;transition:transform .12s,box-shadow .12s;text-align:left;display:flex;flex-direction:column}
.box .badge-row{display:flex;justify-content:flex-end;margin-bottom:6px}
.chain.short>.box,.chain.short>.result{flex:0 1 300px}
.box:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.09)}
.box .lbl{font-size:12.5px;color:var(--ink2);font-weight:600;line-height:1.25;min-height:32px}
.box .val{font-size:clamp(19px,1.8vw,26px);font-weight:650;letter-spacing:-.02em;margin:6px 0 4px;line-height:1.1;white-space:nowrap}
.box .val small{font-size:14px;font-weight:500;color:var(--ink2);margin-left:3px;letter-spacing:0}
.box .line{font-size:12px;color:var(--ink2);line-height:1.35}
.box .pill{position:static}
.box.market{border-color:#9ccf8f}
.box.assumption{border-color:var(--assump);background:var(--assump-bg);box-shadow:inset 0 0 0 1px #f7d3d1}
.box.assumption .val{color:#9c2a27}
.box.fixed{border-style:dashed;background:var(--fixed-bg)}
.box .hint{position:absolute;right:12px;bottom:10px;font-size:11px;color:var(--ink3)}
.result{flex:1.15 1 0;min-width:0;border-radius:14px;padding:12px 16px;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center}
.result .sub{font-size:12px;opacity:.7;margin-top:4px}
.result .lbl{font-size:12px;opacity:.75;font-weight:600}
.result .val{font-size:clamp(19px,1.8vw,26px);font-weight:650;letter-spacing:-.02em;margin-top:6px;white-space:nowrap}
.result.mid{background:var(--chip);color:var(--ink)}
.result.mid .val{font-size:22px;white-space:normal}
.result.mid .lbl{opacity:1;color:var(--ink2)}
.modrow{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.modrow .box{flex:0 1 300px;min-width:240px}
.modrow .result{flex:0 1 260px;min-width:220px}
.modrow .arrow{color:var(--ink2);font-size:13px;display:flex;align-items:center;gap:8px}
.modrow .arrow:before{content:"";width:34px;height:2px;background:var(--line2)}

/* ---------- ladder & streams ---------- */
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media (max-width:980px){.two{grid-template-columns:1fr}}
.ladder{display:grid;grid-template-columns:auto 1fr auto;gap:0;align-items:center}
.ladder .r{display:contents}
.ladder .r>div{padding:9px 0;border-bottom:1px solid var(--line)}
.ladder .r.last>div{border-bottom:none}
.ladder .k{color:var(--ink2);padding-right:18px;white-space:nowrap}
.ladder .bar{height:12px;border-radius:3px;background:var(--c);min-width:2px;display:inline-block;vertical-align:middle}
.ladder .bar.neg{background:var(--assump)}
.ladder .bar.cost{background:#c9c8c2}
.ladder .v{text-align:right;font-weight:600;padding-left:18px;white-space:nowrap}
.ladder .tot .k,.ladder .tot .v{font-weight:650;color:var(--ink)}
.ladder .tot .v{font-size:17px}
.ladder .note{grid-column:1/-1;font-size:12px;color:var(--ink3);padding:6px 0 0}
.streams{display:flex;flex-direction:column;gap:10px}
.stream{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.stream .l{font-size:13.5px;display:flex;align-items:center;gap:8px}
.stream .l i{width:10px;height:10px;border-radius:50%;background:var(--sc);flex:none}
.stream .v{font-weight:650;text-align:right}
.stream .f{grid-column:1/-1;font-size:12px;color:var(--ink3);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding-left:18px}
.stream .track{grid-column:1/-1;height:8px;background:var(--chip);border-radius:3px;overflow:hidden}
.stream .track i{display:block;height:100%;background:var(--sc);border-radius:3px}
.cf{margin-top:12px}
.cf svg{width:100%;height:auto;display:block}
.tiny{font-size:11.5px;color:var(--ink3)}

/* ---------- build page ---------- */
.buildgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:stretch}
@media (max-width:1000px){.buildgrid{grid-template-columns:1fr}}
.dc svg{width:100%;height:auto;display:block}
.areas{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
@media (max-width:1100px){.areas{grid-template-columns:repeat(3,1fr)}}
@media (max-width:700px){.areas{grid-template-columns:1fr 1fr}}
.area{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:default;transition:box-shadow .12s}
.area:hover,.area.hl{box-shadow:0 8px 24px rgba(0,0,0,.1)}
.area .n{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.area .l{font-weight:600;margin:8px 0 2px;font-size:14px;min-height:36px;line-height:1.25}
.area .v{font-size:24px;font-weight:650;letter-spacing:-.02em}
.area .sh{font-size:12px;color:var(--ink2)}
.area .track{height:6px;background:var(--chip);border-radius:3px;margin:8px 0 6px;overflow:hidden}
.area .track i{display:block;height:100%;background:#256abf;border-radius:3px}
.area .sub{font-size:12px;color:var(--ink2);line-height:1.35}
.area .cells{font-size:11px;color:var(--ink3);margin-top:6px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.total{background:var(--ink);color:#fff;border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between}
.total .l{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.7;font-weight:600}
.total .v{font-size:56px;font-weight:650;letter-spacing:-.03em;line-height:1;margin:8px 0 6px}
.total .s{opacity:.8;font-size:14px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:18px;border-top:1px solid rgba(255,255,255,.15);padding-top:14px}
.facts .k{font-size:11.5px;opacity:.65;text-transform:uppercase;letter-spacing:.06em}
.facts .n{font-size:18px;font-weight:600;margin-top:1px}
.cta{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
@media (max-width:900px){.cta{grid-template-columns:1fr 1fr}}
.btn{background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:16px;padding:16px 18px;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:6px}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.1)}
.btn .h{font-size:19px;font-weight:650;display:flex;align-items:center;gap:10px}
.btn .h .letter{width:28px;height:28px;font-size:14px;border-radius:8px;margin:0}
.btn .d{font-size:13px;color:var(--ink2);min-height:38px}
.btn .m{display:flex;gap:16px;margin-top:4px}
.btn .m b{font-size:18px;font-weight:650}
.btn .m span{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;display:block}
.btn .go{margin-top:4px;font-size:13px;color:var(--c);font-weight:600}

/* ---------- summary ---------- */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media (max-width:900px){.cards{grid-template-columns:1fr 1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;border-top:5px solid var(--c)}
.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.09)}
.card .h{font-weight:650;display:flex;align-items:center;gap:8px;font-size:15px}
.card .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
.card .kv .k{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.card .kv .v{font-size:22px;font-weight:650;letter-spacing:-.02em}
.card .kv .v.sm{font-size:16px}
.card .mix{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:980px){.charts{grid-template-columns:1fr}}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{font-size:12.5px;color:var(--ink2);margin-top:6px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:6px 0 4px}
.leg span{display:flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:50%;background:var(--sc)}
.leg i.sq{border-radius:2px}
table.tv{width:100%;border-collapse:collapse;font-size:13px}
table.tv th,table.tv td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.tv th:first-child,table.tv td:first-child{text-align:left}
table.tv th{color:var(--ink2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.tvtoggle{background:var(--chip);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:8px;display:none;max-width:280px;line-height:1.35}

/* ---------- modal ---------- */
.mback{position:fixed;inset:0;background:rgba(20,20,18,.45);z-index:40;display:none;align-items:center;justify-content:center;padding:24px}
.mback.on{display:flex}
.modal{background:#fff;border-radius:18px;max-width:1080px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3);padding:26px 30px 24px;position:relative}
.modal h2{font-size:21px;padding-right:100px;margin-bottom:6px}
.modal .pill{position:absolute;top:26px;right:60px}
.modal .x{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:#fff;cursor:pointer;font-size:18px;line-height:1}
.modal .sum{font-size:15px;color:var(--ink);margin:8px 0 14px;max-width:900px}
.modal h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:18px 0 8px;font-weight:600}
.modal table{width:100%;border-collapse:collapse;font-size:13px}
.modal th,.modal td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.modal th{color:var(--ink2);font-weight:600;font-size:12px;background:#fafaf8;position:sticky;top:0}
.modal td.r,.modal th.r{text-align:right;white-space:nowrap}
.modal .note{font-size:13px;color:var(--ink2);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.modal a.src{color:var(--rent);text-decoration:none;font-weight:600}
.modal a.src:hover{text-decoration:underline}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.links a{font-size:12.5px;border:1px solid var(--line2);border-radius:999px;padding:4px 11px;text-decoration:none;color:var(--ink2)}
.links a:hover{background:var(--chip)}

footer{max-width:1400px;margin:0 auto;padding:18px 28px 40px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
footer a{color:var(--ink2)}
.navbtns{display:flex;justify-content:space-between;margin-top:22px}
.navbtns button{background:#fff;border:1px solid var(--line2);border-radius:999px;padding:8px 16px;cursor:pointer;color:var(--ink2)}
.navbtns button:hover{background:var(--chip);color:var(--ink)}
@media print{.top,.navbtns,footer{display:none}section.page{display:block!important;min-height:0;page-break-after:always}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand">1 GW of Blackwell <span>rent it, or serve tokens on it?</span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="legend"><span class="pill market"><i></i>Market</span><span class="pill assumption"><i></i>Assumption</span><span class="pill fixed"><i></i>Fixed</span></div>
</div></div>

<div class="live idle" id="live"></div>
<main id="main"></main>

<footer>
  <div id="foot-left"></div>
  <div><a id="foot-link" href="../dashboard.html">Open the full model (every dial, every source) &rarr;</a></div>
</footer>

<div class="tip" id="tip"></div>
<div class="mback" id="mback"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

</body>

<style>

*{box-sizing:border-box}
html{scroll-behavior:smooth}

.muted{color:var(--ink2)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.live .tvtoggle{margin-left:auto}

/* ---------- sections ---------- */
main{max-width:1400px;margin:0 auto;padding:0 28px 40px}
section.page{display:none;padding:34px 0 24px;min-height:calc(100vh - 58px)}
section.page.on{display:block;animation:fade .25s ease}

.phead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:start;margin-bottom:26px}

.block{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px}

.chain{display:flex;align-items:stretch;gap:10px;flex-wrap:nowrap}

.op{align-self:center;width:30px;height:30px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink2);font-size:18px;flex:none}

.box.assumption{border-color:var(--assump);background:var(--assump-bg);box-shadow:inset 0 0 0 1px #f7d3d1}

.result .val{font-size:clamp(19px,1.8vw,26px);font-weight:650;letter-spacing:-.02em;margin-top:6px;white-space:nowrap}

.result.mid .lbl{opacity:1;color:var(--ink2)}
.modrow{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.modrow .box{flex:0 1 300px;min-width:240px}
.modrow .result{flex:0 1 260px;min-width:220px}

.ladder .r>div{padding:9px 0;border-bottom:1px solid var(--line)}
.ladder .r.last>div{border-bottom:none}
.ladder .k{color:var(--ink2);padding-right:18px;white-space:nowrap}
.ladder .bar{height:12px;border-radius:3px;background:var(--c);min-width:2px;display:inline-block;vertical-align:middle}
.ladder .bar.neg{background:var(--assump)}
.ladder .bar.cost{background:#c9c8c2}
.ladder .v{text-align:right;font-weight:600;padding-left:18px;white-space:nowrap}
.ladder .tot .k,.ladder .tot .v{font-weight:650;color:var(--ink)}
.ladder .tot .v{font-size:17px}
.ladder .note{grid-column:1/-1;font-size:12px;color:var(--ink3);padding:6px 0 0}
.streams{display:flex;flex-direction:column;gap:10px}
.stream{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.stream .l{font-size:13.5px;display:flex;align-items:center;gap:8px}
.stream .l i{width:10px;height:10px;border-radius:50%;background:var(--sc);flex:none}
.stream .v{font-weight:650;text-align:right}
.stream .f{grid-column:1/-1;font-size:12px;color:var(--ink3);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding-left:18px}
.stream .track{grid-column:1/-1;height:8px;background:var(--chip);border-radius:3px;overflow:hidden}
.stream .track i{display:block;height:100%;background:var(--sc);border-radius:3px}
.cf{margin-top:12px}
.cf svg{width:100%;height:auto;display:block}
.tiny{font-size:11.5px;color:var(--ink3)}

/* ---------- build page ---------- */
.buildgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:stretch}
@media (max-width:1000px){.buildgrid{grid-template-columns:1fr}}
.dc svg{width:100%;height:auto;display:block}
.areas{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
@media (max-width:1100px){.areas{grid-template-columns:repeat(3,1fr)}}
@media (max-width:700px){.areas{grid-template-columns:1fr 1fr}}
.area{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:default;transition:box-shadow .12s}
.area:hover,.area.hl{box-shadow:0 8px 24px rgba(0,0,0,.1)}
.area .n{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.area .l{font-weight:600;margin:8px 0 2px;font-size:14px;min-height:36px;line-height:1.25}
.area .v{font-size:24px;font-weight:650;letter-spacing:-.02em}
.area .sh{font-size:12px;color:var(--ink2)}
.area .track{height:6px;background:var(--chip);border-radius:3px;margin:8px 0 6px;overflow:hidden}
.area .track i{display:block;height:100%;background:#256abf;border-radius:3px}
.area .sub{font-size:12px;color:var(--ink2);line-height:1.35}
.area .cells{font-size:11px;color:var(--ink3);margin-top:6px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.total{background:var(--ink);color:#fff;border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between}
.total .l{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.7;font-weight:600}
.total .v{font-size:56px;font-weight:650;letter-spacing:-.03em;line-height:1;margin:8px 0 6px}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:18px;border-top:1px solid rgba(255,255,255,.15);padding-top:14px}
.facts .k{font-size:11.5px;opacity:.65;text-transform:uppercase;letter-spacing:.06em}

.cta{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}

.btn{background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:16px;padding:16px 18px;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:6px}

.modal table{width:100%;border-collapse:collapse;font-size:13px}
.modal th,.modal td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.modal th{color:var(--ink2);font-weight:600;font-size:12px;background:#fafaf8;position:sticky;top:0}

.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}

.links a:hover{background:var(--chip)}

footer{max-width:1400px;margin:0 auto;padding:18px 28px 40px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}

.navbtns{display:flex;justify-content:space-between;margin-top:22px}
.navbtns button{background:#fff;border:1px solid var(--line2);border-radius:999px;padding:8px 16px;cursor:pointer;color:var(--ink2)}
.navbtns button:hover{background:var(--chip);color:var(--ink)}
@media print{.top,.navbtns,footer{display:none}section.page{display:block!important;min-height:0;page-break-after:always}}
</style>

ed to $/GPU-hr at this fleet's GPUs per MW (facility MW divided by PUE)", "ondemand": "Median of published on-demand GB200/GB300 per-GPU-hour quotes (data/rental_rates.json: quotes, hyperscaler list included)", "acv2026": "2026 new-deal annual contract value per IT-MW (IREN, Nebius stated figures) converted at this fleet's GPUs per IT-MW"}, "near_bases_note": {"all_median": "Median of every current published GB300 / B300 per-GPU-hour rate - spot / preemptible, on-demand and capacity blocks, every provider tracked (data/rental_rates.json quotes; engine/rental_history.py). Default since 2026-10-13 (Lev): the median moves with the market when providers reprice, and a single provider's outlier rate (a hyperscaler list price, a deep spot discount) does not drag it. A quote counts as current when it was read within max_quote_age_days and the vendor still publishes it; reserved / contract rows and the aggregator indices are not in it.", "all_avg": "Average (mean) of the same rates. The default from 2026-10-12 to 2026-10-13; every provider's price change moves it in proportion, outliers included.", "spot": "Median of current spot / preemptible Blackwell Ultra (GB300, B300) rates, neoclouds and hyperscalers alike (AWS EC2 Spot for p6-b300 is the hyperscaler row; Azure's GB200 spot equals pay-as-you-go, Google Cloud publishes Spot only for B200, Oracle has no preemptible bare-metal GPU shapes). The default until 2026-10-12.", "neocloud": "Median of neocloud (non-hyperscaler) on-demand GB200/GB300 quotes", "ondemand": "Median of all published on-demand GB200/GB300 quotes, hyperscaler list included", "sdb200": "Silicon Data SDB200RT: observed B200 rental-rate index (older part; reference for the level of the cleared market)", "ornnb200": "Ornn Compute Price Index for B200: volume-weighted average of transacted rental rates, settled daily (older part; a second, transaction-based reference for the level of the cleared market)"}, "term_note": "Years 1 to spot_years rent at the near-term rate (near_term_basis: the median of every current GB300/B300 rate by default); the rate then moves linearly to the long-term rate ('basis' above, contract by default) over converge_years, and stays there. With spot_years = 1 and converge_years = 3: year 1 = spot, year 2 = two thirds of the gap, year 3 = one third, year 4 onward = long-term. With spot_years = 3 and converge_years = 0 the spot rate holds for three years and steps to the long-term rate in year 4. rental_rate_decline_per_year in 'finance' compounds on top. Both are dials on the page; the cash-flow table shows the rate and utilisation assumed in every year. The Silicon Data and Ornn B200 indices are shown against every path as the two daily, market-based references; no GB200/GB300 index exists."}, "finance": {"life_years": 5, "compute_life_years": 5, "shell_life_years": 20, "compute_residual": 0.0, "shell_residual": 0.0, "tax_rate": 0.0, "rental_rate_decline_per_year": 0.0, "token_price_decline_per_year": 0.0}, "finance_note": "Pre-tax. Cash flows: -capex at t0, then EBITDA for life_years (the analysis horizon), plus the book value still on the books at the end of the horizon as a terminal inflow in the last year (assets recovered at book). Depreciation is straight-line in two pools, both dials on the page: compute (GPUs + racks, the mastersheet's rack cost x racks) over compute_life_years to compute_residual, and the powered shell / mechanical / electrical (the mastersheet's shell cost) over shell_life_years to shell_residual. A pool whose life exceeds the horizon is only partly depreciated within it and the rest is recovered as terminal value. ROIC = (average annual EBITDA over the horizon - average annual depreciation over the horizon) / capex, with year-1 ROIC beside it. Defaults: 5-year horizon, 5-year GPU/compute life and 20-year shell life, no residual (set by Lev 2026-09-24; builds up to 2026-09-23 had the shell on 5 years. data/roic_history.csv keeps each day as built; the ROIC history page and data/roic_history_restated.csv restate every day on today's assumptions, see engine/restate.py). They are the dashboard's own assumption, not the mastersheet's, which carries no depreciation life: hyperscalers depreciate servers over 5-6 years (Amazon 5 for its newer fleet since 2025, Microsoft and Alphabet 6, Meta 5.5; CoreWeave 6) and data-centre shells over 20-30 years with electrical and mechanical plant at 10-20, so 20 years sits within the range for the shell. The two decline dials apply a compounding annual fall to the rental rate and to token prices.", "serving_defaults": {"interactivity_basis": "measured", "interactivity_tok_s_per_user": 100, "workload": "8k/1k", "price_basis": "effective", "cache_hit_rate": null, "frontier_derate": 0.5, "tps_realisation": "market", "realisation": 1.0, "split_mode": "cost", "premium_tolerance": null, "closed_share_override": null, "basket": "anthropic", "frontier_realisation": "reference", "implied_rate": "near", "throughput_scope": "measured", "volumes": "traces", "closed_share_override_openai": null, "renter_roic": 0.1, "training_share": 0.5}, "aws": {"rev_share": 0.25, "note": "Scenario F, 'AWS ROIC': the Anthropic token scenario (B) re-monetised the way a hyperscaler landlord earns it, with 0% training. The GPUs B allocates to Anthropic's frontier tokens are rented to Anthropic at the rental scenario's rate path and rental utilisation (the base rental fee, same as A), and the fleet owner also takes rev_share of every Anthropic-model token dollar those GPUs generate (B's frontier token revenue at token utilisation and the frontier realisation factor). The rest of the fleet serves open-weight tokens exactly as in B. Power and other opex as in B (the owner runs the whole site)."}, "serving_notes": {"interactivity": "The fixed tokens-per-second-per-user point used when interactivity_basis is 'fixed'. Lower it and every model serves more tokens per GPU.", "workload": "Benchmark shape the economics run on. '8k/1k' (8,192 input / 1,024 output per request) is the standard single-turn shape. Each model is billed at its own measured input:output rate from the same InferenceX run (8:1 by construction for this shape), so throughput and billing describe the same request. '1k/1k' is the other measured shape. A model with no run under the chosen shape on any Blackwell part is excluded from the mix.", "cache_hit_rate": "Only used under the 'list' price basis. null = each model's measured OpenRouter cache-hit rate; a number 0-1 overrides it for every model.", "frontier_derate": "The frontier basket's tokens per GPU = the largest open model measured on this chip and workload x this factor. No lab publishes its own throughput, so this is the one proxy left in the model, and it is labelled as such wherever it appears.", "realisation": "Multiplier on list price for frontier tokens (1.0 = list; 0.5 = everything at batch price).", "split_mode": "How the frontier (closed) vs open-weight split of output tokens is set. 'cost' = the task framework's frontier share per task, pulled down where the frontier premium exceeds premium_tolerance (the dial). 'openrouter' = the closed-weight share of completion tokens OpenRouter routed in its latest weekly ranking (every closed lab, not just the basket), applied to both serving scenarios; the within-tier mixes stay. 'manual' = closed_share_override / closed_share_override_openai.", "premium_tolerance": "The cost dial, in multiples of the open-weight price: a task keeps its framework frontier share while the frontier basket costs no more than this many times the routed open-weight mix for the task's own token shape (input and output priced separately, on the price basis in force, frontier at its realised price); above it the share falls as (tolerance / premium) ^ (1 - framework share), so a task rated 5 never moves, a 4 moves a third as fast as a 3, and 2-and-below stay open. null = no limit = the framework unchanged. Recomputed per basket from the live prices on every run and every dial move.", "closed_share_override": "Manual overlay for scenario B (Anthropic basket), used only when split_mode is 'manual': a number 0-1 forces the frontier share of OUTPUT tokens to that value, keeping the within-bucket mixes; null = the framework's derived share.", "tps_realisation": "Fraction of the published benchmark throughput a production GPU-hour realises. 'market' = implied per model by the open-weight token market: for each open model, (rental rate x (1 + renter_roic)) / (what a GPU-hour would earn at that model's benchmark peak x that model's own price), capped at 1. Each model carries its own factor; nothing is averaged across models. It bundles real utilisation, latency headroom and host margin into one number the market sets per model, and it means a competitively hosted open model earns the spot rental rate plus the renter's return per GPU-hour unless its benchmark ceiling is below it. 1.0 = benchmark peak (a ceiling). Any other number is one manual factor for every model. data/anchors.json holds public evidence to judge it against.", "interactivity_basis": "'measured' = each model's throughput curve is read at the output speed OpenRouter's hosts actually deliver for that model (token-weighted median of per-host 7-day tok/s per request); 'fixed' = every model at interactivity_tok_s_per_user.", "price_basis": "'effective' = the traffic-weighted price OpenRouter customers actually paid per token over the trailing week (cache hits already embedded in the input price; frontier rows use the lab's own OpenRouter traffic); 'list' = cheapest host's list price for open weights and the lab's list price for frontier, with cache hits blended at the measured rate.", "frontier_realisation": "Which realisation factor the frontier basket gets under 'market' (no lab's models are hosted competitively, so none has a market-implied factor of its own). 'reference' = the factor of the open model whose curve the basket borrows; 'median' = token-weighted median of the open models' factors; a number 0-1 = manual.", "basket": "Which lab's models carry the frontier tokens in the headline serving scenario: 'anthropic' or 'openai'. The page computes both baskets side by side; this only picks which one the verdict paragraph and history line lead with.", "implied_rate": "Which rental rate the market-implied realisation is built on: 'near' (default since 2026-10-12) = the near-term rate of the rental scenario, by default the median of every current published GB300 / B300 rate (spot, on-demand and capacity blocks, every provider), so a provider's price change moves what an open-weight GPU-hour is made to earn as well as scenario A; 'spot' = the median of the current GB300 and B300 spot / preemptible rates (the default until 2026-10-12); 'longterm' = the long-term basis the rental scenario converges to (contract by default). renter_roic is added on top.", "throughput_scope": "'measured' = only models InferenceX has benchmarked under their own name can carry tokens (no proxies; unbenchmarked traffic is re-spread). 'estimated' = every open model OpenRouter routes to carries tokens; a model with no benchmark of its own gets the best estimate, in order: the InferenceX curve of the same architecture under another name (family curve), else a log-log fit of output tok/s per GPU on active parameters across every benchmarked model at that model's interactivity (fitted). Every estimated row is flagged and vendor-reported measurements are shown beside it where any exist.", "volumes": "'traces' = tasks mapped to an agent-trace family take measured per-run token volumes by model family (Anthropic, OpenAI, DeepSeek, Kimi, open-weight average) from data/traces.json; 'pooled' = the same tasks take one measured volume per task pooled across every model family (removes provider differences in how reasoning tokens are counted); 'framework' = every task uses calls x task-type shapes, the same for every model. Unmapped tasks always keep the framework shapes.", "closed_share_override_openai": "Manual overlay for scenario C (OpenAI basket), same meaning, used only when split_mode is 'manual'. The two overlays are independent.", "renter_roic": "The return a host earns renting a GPU at the rate above and serving an open-weight model on it: the realisation factor of every open model is set so that its GPU-hour earns rate x (1 + renter_roic). 0.10 = a 10% return on the rent paid; the GPU-hour earns $4.73 at a $4.30 spot rate. 0 reproduces the pure arbitrage condition (the GPU-hour earns exactly the rent). The frontier basket inherits the reference model's factor, so it scales with this too.", "training_share": "Share of the fleet's capacity given to training in the token-selling scenarios B and C (dial, 0-100%): token revenue falls linearly with it (the serving GPUs are the rest of the fleet), power does not (training GPUs run at least as hard). D, E and the AWS scenario keep 0%. Default 50% (set by Lev 2026-09-24: a frontier lab that owns its fleet trains on about half of it); it was 0% before that date, so ROIC history rows up to 2026-09-23 are on a 0% basis."}, "workloads": {"8k/1k": {"isl": 8192, "osl": 1024}, "1k/1k": {"isl": 1024, "osl": 1024}}, "demand": {"types": {"code_generation": {"name": "Code generation", "tag": "code:general_impl", "tin": 3000, "tout": 800}, "debugging": {"name": "Debugging", "tag": "code:debugging", "tin": 5000, "tout": 600}, "code_review": {"name": "Code review", "tag": "code:review_security", "tin": 6000, "tout": 700}, "sql_database": {"name": "SQL and database", "tag": "code:sql_database", "tin": 1800, "tout": 350}, "frontend_ui": {"name": "Frontend and UI", "tag": "code:frontend_ui", "tin": 3200, "tout": 1200}, "devops_config": {"name": "DevOps config", "tag": "code:devops_config", "tin": 2200, "tout": 500}, "shell_execution": {"name": "Shell execution", "tag": "code:shell_execution", "tin": 1200, "tout": 150}, "file_io": {"name": "File I/O", "tag": "code:file_read_writ H1 2025, 18.9% for FY2025); management attributes the rise to scale diluting fixed costs, price increases (average API selling price up ~101% since January) and inference engineering. Cost of sales RMB 702m, 'primarily attributable to the increase in computing service fees'. R&D RMB 2,131m, driven by model training. Inference served from 'a cluster of over 100,000 domestic chips', unit token inference cost down 80% since the start of 2026. Capex RMB 391m, mostly the Beijing Hongzuan asset purchase (RMB 360m of PP&E); PP&E RMB 855m at 30 June 2026.", "implied": "The margin is API revenue over rented inference compute: training compute sits in R&D and owned-hardware depreciation is still immaterial. 24.6% therefore means revenue of about 1.3x the serving rent, against the 1.1x the market-implied realisation factor assumes.", "url": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0831/2026083101539.pdf", "date": "2026-08-31", "read_on": "2026-09-15", "computed_by_us": "the 1.3x ratio (1 / (1 - 0.246))"}, {"name": "Z.ai (Zhipu) HKEX prospectus, Dec 2025: what sits in cost of revenue", "kind": "cost structure", "facts": "Cost of revenue H1 2025 RMB 95.5m: payroll 39.4%, 'computing service fee paid to providers of computing power' (third-party cloud) 37.6%, warranty 7.0%, D&A 2.2%, other 13.8%. R&D H1 2025 RMB 1,595m, of which computing service fees RMB 1,145m (71.8%). Cloud-based deployment gross margin 76.1% (2022), 31.0% (2023), 3.4% (2024), -0.4% (H1 2025). Compute bought under 1-4 year framework agreements; largest supplier in 2023-24 was the cloud subsidiary of a large Chinese internet company (RMB 395m in 2024). Flagship GLM-4.5 'open-sourced upon launch'.", "implied": "About 97% of Zhipu's compute spend sat in R&D (training), not cost of sales: the reported inference gross margin excludes training and, until 2026, any owned hardware.", "url": "https://www1.hkexnews.hk/listedco/listconews/sehk/2025/1230/2025123000017.pdf", "date": "2025-12-30", "read_on": "2026-09-15", "computed_by_us": "the 97% share (1,145 / (1,145 + 36))"}, {"name": "MiniMax (HKEX 0100) H1 2026 interim results announcement", "kind": "inference gross margin", "facts": "Revenue $116.6m: Open Platform and enterprise $73.9m (63.4%), AI-native products $42.6m. Cost of sales $95.8m; gross margin 17.9% (12.1% in H1 2025), 'primarily driven by improving infrastructure efficiency'. No segment margins disclosed. Depreciation of PP&E $2.3m in total; R&D $296.9m 'mainly attributable to an increase in cloud services expenses related to training activities'. PP&E $74.9m (from $1.6m) and non-current prepayments $100.8m (from $0.9m), composition not explained. Alibaba Cloud purchases $75.9m in FY2025 and $75.6m in H1 2026; annual caps raised to $300m / $400m / $500m for 2026-28 (26 Aug 2026 announcement).", "implied": "If the consumer apps stayed near their 9M25 margin (~5%), the Open Platform earned roughly 25% in H1 2026, i.e. revenue about 1.3x rented inference compute, in line with Z.ai; the 60-70% API margins of 2024-25 did not survive the volume ramp and the flat-rate token plans.", "url": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0826/2026082600680.pdf", "date": "2026-08-26", "read_on": "2026-09-15", "computed_by_us": "the implied Open Platform margin, (20.8 - 0.05 x 42.6) / 73.9"}, {"name": "MiniMax HKEX prospectus, Dec 2025: what sits in cost of sales, margins by source", "kind": "cost structure", "facts": "'Our cost of sales primarily consists of expenses associated with cloud services related to inference, as well as platform commission fees'; inference cloud = 95.0% (2023), 96.9% (2024), 92.7% (9M25) of cost of sales; 'cloud service expenses related to training are recognised under research and development expenses'. 'Light-asset business model, whereby critical computing infrastructure assets are owned and maintained by our suppliers ... without directly owning hardware assets'. Gross margin by source, 9M25: AI-native products 4.7% (-23.5% in 9M24), Open Platform and enterprise 69.4% (63.2% in FY2024, 75.1% in FY2023); blended 23.3%. Five largest suppliers (cloud and technology service providers) = 62.5% of purchases; Alibaba Cloud subsidiaries (Supplier J, a substantial shareholder) among them. M1 and M2 released as open-source models.", "implied": "At small scale (API revenue $15.4m in 9M25) the API line earned about 3x its inference rent; the blended margin is dragged down by consumer apps whose free users consume inference.", "url": "https://www1.hkexnews.hk/listedco/listconews/sehk/2025/1231/2025123100025.pdf", "date": "2025-12-31", "read_on": "2026-09-15", "computed_by_us": "the 3x ratio (1 / (1 - 0.694))"}, {"name": "Anthropic compute cost per dollar of revenue (PitchBook via Yahoo Finance; reported, not disclosed)", "kind": "frontier lab cost ratio", "facts": "Reported $0.71 of computing power per dollar of revenue in Q1 2026, projected $0.56 in Q2 2026. Single-source press figure; Anthropic has not disclosed it.", "implied": "If accurate, revenue about 1.4-1.8x total compute cost (training included), i.e. the frontier premium over the commodity market's ~1.3x is real but far smaller than list-price arithmetic suggests.", "url": "https://finance.yahoo.com/markets/stocks/articles/anthropics-gross-margin-most-important-070500338.html", "date": "2026-06-10", "read_on": "2026-09-04", "computed_by_us": "the ratios"}, {"name": "InferenceX methodology note", "kind": "benchmark caveat", "facts": "Benchmarks use random data with prefix caching disabled; results are 'baseline data and not completely representative of real-world inference' and do not capture under-utilisation or downtime.", "implied": "The published curves are a ceiling by construction.", "url": "https://newsletter.semianalysis.com/p/inferencex-v2-nvidia-blackwell-vs", "date": "2026-02-16", "read_on": "2026-09-04", "computed_by_us": null}], "vendor_points": [{"model": "deepseek-v4-flash", "name": "DeepSeek V4 Flash", "hw": "B300", "gp   src.seconds = {title: "Seconds per year", kind: "fixed", badge: "Fixed", summary: "365 x 24 x 3,600 = 31,536,000 seconds. A calendar constant; tokens per second per chip x seconds gives tokens per chip-year at 100% utilisation.", tables: [], links: [], note: ""};
  src.rent_util = {title: `Utilisation rate: ${r0(Rn.util)}% of hours sold`, kind: "assumption", badge: "Assumption",
    summary: `Share of GPU-hours that earn rent. The default comes from the ROIC Dashboard sheet of the mastersheet (${cellOf("rent_util") || "fallback"}: ${pc(F.rent_util, 0)}); no public data reports the sold share of a rented Blackwell fleet.` + (Math.abs(Rn.util - F.rent_util) > 1e-9 ? ` Currently set to ${pc(Rn.util, 0)} on the full model.` : ""),
    tables: [], links: [], note: `Every 10 points of utilisation moves rental revenue by $${B2(gpus * Rn.rate_avg * HOURS * 0.1)} a year at the average rate.`};
  src.serve_util = {title: `Token utilisation: ${r0(S.util)}% of chip-seconds producing tokens`, kind: "assumption", badge: "Assumption",
    summary: `Share of every chip-second that is busy generating billable tokens (the rest is idle capacity, failover and demand troughs). The default comes from the mastersheet's ROIC Dashboard sheet (${cellOf("serve_util") || "fallback"}: ${pc(F.serve_util, 0)}).` + (Math.abs(S.util - F.serve_util) > 1e-9 ? ` Currently set to ${pc(S.util, 0)} on the full model.` : ""),
    tables: [], links: [], note: "Applied on top of the realised tokens per second, which already reflects production efficiency (see that box)."};
  src.gpu_life = {title: `Lifetime of GPUs: ${dep.compute_life} years`, kind: "assumption", badge: "Assumption",
    summary: `GPUs and racks ($${B1(dep.compute_cost)}) are depreciated straight-line over ${dep.compute_life} years to ${r0(dep.compute_residual)}% residual; the analysis horizon is ${life} years. This is the dashboard's own assumption (assumptions.json 'finance'); the mastersheet carries no depreciation life.`,
    tables: [{caption: "Context from the assumptions file", columns: ["Owner", "Server depreciation life"], rows: [["Amazon (newer fleet, since 2025)", "5 years"], ["Microsoft", "6 years"], ["Alphabet", "6 years"], ["Meta", "5.5 years"], ["CoreWeave", "6 years"]]}],
    links: [], note: `Annual depreciation of the compute pool: $${B2(dep.compute_path[0])}${dep.terminal_compute ? "; book value recovered at the end of year " + life + ": $" + B1(dep.terminal_compute) : ""}.`};
  src.shell_life = {title: `Lifetime of shell: ${dep.shell_life} years`, kind: "assumption", badge: "Assumption",
    summary: `The powered shell, mechanical and electrical plant ($${B1(dep.shell_cost)}) is depreciated over ${dep.shell_life} years to ${r0(dep.shell_residual)}% residual against a ${life}-year horizon. The assumptions file notes shells are commonly depreciated over 20-30 years and M&E over 10-20, so a 15-year shell life is the defensible alternative; any life beyond the horizon is recovered as book value at the end of year ${life} (it raises the IRR, not the ROIC).`,
    tables: [], links: [], note: `Annual depreciation of the shell pool: $${B2(dep.shell_path[0])}${dep.terminal_shell ? "; book value recovered at exit: $" + B1(dep.terminal_shell) : ""}.`};
  src.pct_inference = {title: `Share of chips serving inference: ${r0(1 - S.training_share)}%`, kind: "assumption", badge: "Assumption",
    summary: `The 'training share' dial of the full model gives part of the fleet to training, which earns no token revenue. It is set to ${r0(S.training_share)}%${S.training_share ? ", so " + n0(S.training_gpus) + " chips train and " + n0(S.serving_gpus) + " serve tokens" : ", so every chip serves tokens"}.`,
    tables: [], links: [], note: "Chips given to training still draw power and carry depreciation in the model."};
  const orw = OR.closed_share_week || {};
  const modeText = {cost: "the model's task framework: 20 knowledge-work task types, each rated 1-5 on reasoning depth and consequence; frontier share = clamp((max(reasoning, consequence) - 2) / 3, 0, 1)" + (R.premium_tolerance ? `, pulled down where the frontier basket costs more than ${R.premium_tolerance}x the open-weight mix` : ""),
    openrouter: "the closed-weight share OpenRouter routed in its latest weekly ranking, applied as an override", manual: "a manual override dial on the full model"}[S.split_mode] || S.split_mode;
  src.pct_closed = {title: `Closed-weight share of tokens: ${pc(S.closed_share)}`, kind: "assumption", badge: "Assumption",

    tables: [{caption: "Market cross-check (reference, not the input)", columns: ["Measure", "Value", "As of"], rows: [
      ["OpenRouter weekly ranking: closed-weight share of completion tokens, every closed lab", orw.out != null ? pc(orw.out) : "", String(orw.week_date || "").slice(0, 10)],
      ["Same, share of all tokens (input + output)", orw.total != null ? pc(orw.total) : "", String(orw.week_date || "").slice(0, 10)]]}],
    links: [{label: "OpenRouter rankings", url: "https://openrouter.ai/rankings"}],
    note: `Because frontier tokens are slower per chip, ${pc(S.closed_share)} of tokens takes ${pc(S.frontier_share_of_gpus)} of the serving chips (${n0(S.frontier_gpus)} GPUs).`};

  const tpsSource = (sc, prefix) => {
    const rows = sc.rows.filter(r => r.share > 0).map(r => [r.name, r.tier === "frontier" ? "closed" : "open", pc(r.share), n0(r.tps_bench || 0), pc(r.f, 0), n0(r.tps), n0(r.gpus), r.tps_basis, r.tps_url || ""]);
    const basis = sc.tps_realisation_basis;
    const how = basis === "market-implied per model"
      ? `for open models the factor that makes a GPU-hour serving that model earn the ${sc.rate_f_label} plus a ${r0(sc.renter_roic)}% renter margin ($${f2(sc.rate_f)}/GPU-hr); the closed models borrow the largest measured open model's curve at a ${r0(dials.frontier_derate)}% derate and ${sc.f_frontier_basis} (${pc(sc.f_frontier, 0)})`
      : basis === "manual" ? `a manual factor of ${pc(sc.f_gpu_weighted, 0)} set on the full model` : "no haircut at all: every model at its published benchmark peak";
    return {title: `${prefix}: ${n0(sc.eff_tps)} output tokens per second per chip`, kind: "assumption", badge: "Assumption",
      summary: `Fleet-average output tokens per busy chip-second. Each model starts from its own SemiAnalysis InferenceX benchmark on GB300 at the ${dials.workload} request shape and ${dials.interactivity_basis === "measured" ? "its measured interactivity" : dials.interactivity + " tok/s per user"}, then takes a realisation factor: ${how}. Chips are allocated so every model gets its share of tokens.`,
      tables: [{caption: `Per model (InferenceX read ${I.throughput_meta.read_on}, newest run ${I.throughput_meta.newest_run})`, columns: ["Model", "Weights", "Share of tokens", "Benchmark tok/s/GPU", "Realisation", "Realised tok/s/GPU", "GPUs", "Basis", "url"], rows}],
      links: [{label: "SemiAnalysis InferenceX", url: "https://inferencex.semianalysis.com/"}],
      note: `The benchmark points are market data; the realisation factor and the frontier proxy are the model's assumptions, which is why this box is red. At benchmark peak with no realisation haircut the open-weight fleet would earn $${f2(R.serve_open_peak.rev_per_gpu_hr)} per GPU-hour (scenario E in the full model).`};
  };
  src.tps_lab = tpsSource(S, "Tokens per second per chip, Anthropic scenario");
  src.tps_open = tpsSource(Dn, "Tokens per second per chip, open-weight scenario");

  const priceSource = (sc, prefix, closed) => {
    const rows = sc.rows.filter(r => r.share > 0).map(r => { const p = r.price; return [r.name, r.tier === "frontier" ? "closed" : "open", pc(r.share), "$" + f2(p.out), "$" + f2(p.in),
      p.eff_out != null ? "$" + f2(p.eff_out) : "", p.eff_in != null ? "$" + (+p.eff_in).toFixed(3) : "", "$" + f2(r.blended_per_m_out), p.provider || "", p.read_on || "", p.url || ""]; });
    const tables = [{caption: "Per model: list price, OpenRouter traffic-weighted effective price (cache discounts embedded), and the all-in price per million output tokens with input billed at the request's own ratio" + (priceRealised && closed ? `; frontier prices x ${pc(dials.realisation, 0)} realisation` : ""),
      columns: ["Model", "Weights", "Share of tokens", "List out $/M", "List in $/M", "Effective out $/M", "Effective in $/M", "All-in $/M output", "Price source", "Read on", "url"], rows}];
    const ref = [];
    for (const [k, lab] of [["llm", "Silicon Data LLM Token Expenditure Index (broad market)"], ["proprietary", "Silicon Data Proprietary LLM index"], ["open", "Silicon Data Open LLM index"]]) {
      const [v, d] = tokLatest[k] || [null, null]; if (v != null) ref.push([lab, "$" + f2(v), d, (tok[k] || {}).url || ""]);
    }
    ref.push(["This scenario, same basis (per M tokens, input + output)", "$" + f2(sc.blended_per_m_total), I.built_at.slice(0, 10), ""]);
    if (closed) { ref.push(["  of which closed models", "$" + f2(sc.frontier_per_m_total), "", ""]); ref.push(["  of which open models", "$" + f2(sc.open_per_m_total), "", ""]); }
    tables.push({caption: "Market cross-check: usage-weighted dollars per million tokens (input + output)", columns: ["Index", "$/M tokens", "As of", "url"], rows: ref});
    const pb = dials.price_basis === "effective" ? "OpenRouter traffic-weighted effective prices" : "list prices";
    const summ = closed
      ? `Token-weighted across the fleet: closed models at $${f2(sc.frontier_blended_per_m_out)} per million output tokens all-in (${pc(sc.closed_share, 0)} of tokens) and open-weight models at $${f2(sc.open_blended_per_m_out)} (${pc(1 - sc.closed_share, 0)}) blend to $${f2(sc.blended_per_m_out)}. Prices are what the market charges today: Anthropic's list prices (read ${I.lab_prices_meta.read_on}) and the ${pb} of every open model (read ${OR.read_on}).` + (priceRealised ? ` The full model applies a ${pc(dials.realisation, 0)} price realisation to the frontier basket.` : "")
      : `Token-weighted across the ${sc.n_open_models} open-weight models the framework routes to, at each model's ${pb} (read ${OR.read_on}): $${f2(sc.blended_per_m_out)} per million output tokens all-in, with input billed at the request's own ratio.`;
    return {title: `${prefix}: $${f2(sc.blended_per_m_out)} per million output tokens`, kind: priceRealised && closed ? "assumption" : "market", badge: priceRealised && closed ? "Market x realisation" : "Market", summary: summ, tables,
      links: [{label: "Anthropic pricing", url: "https://platform.claude.com/docs/en/about-claude/pricing"}, {label: "OpenRouter models", url: "https://openrouter.ai/models"}],
      note: `'All-in per million output tokens' = output price + the request's input:output ratio x effective input price, so one number prices a whole request. Token prices ${dials.token_decline ? "fall " + pc(dials.token_decline, 0) + " a year" : "are held flat"} over the ${life} years.`};
  };
  src.price_lab = priceSource(S, "Token price, Anthropic scenario", true);
  src.price_open = priceSource(Dn, "Token price, open-weight scenario", false);
  src.pct_rented = {title: `Share of chips rented to Anthropic: ${pc(W.frontier_gpus / gpus)}`, kind: "assumption", badge: "Assumption",
    summary: `The chips the Anthropic serving scenario allocates to Anthropic's own models (${n0(W.frontier_gpus)} of ${n0(gpus)} GPUs) are the block AWS rents to Anthropic. It follows from the closed-weight token share (${pc(W.closed_share)}) and the closed models' slower throughput per chip; the remaining ${n0(W.open_gpus)} GPUs serve open-weight tokens for AWS's own account.`,
    tables: [], links: [], note: `The block earns the rental scenario's rate path ($${f2(Rn.rate_avg)} average) at ${r0(W.rent_util)}% rental utilisation, plus the revenue share.`};
  src.rev_share = {title: `Anthropic revenue share: ${r0(W.rev_share)}%`, kind: "assumption", badge: "Assumption",
    summary: `The fleet owner's share of every token dollar Anthropic's models earn on the rented block (the 'AWS scenario' dial; default ${r0((I.aws || {}).rev_share || 0.25)}% from assumptions.json). No public disclosure of the AWS-Anthropic commercial split exists.`,
    tables: [], links: [], note: `Anthropic's token revenue on the block: $${B1(W.frontier_token_rev_hr * HOURS)} a year at ${r0(W.util)}% token utilisation; the owner's share is $${B1(W.rev_share * W.frontier_token_rev_hr * HOURS)}.`};

  // --- scenarios
  const driver = (id, label, value, fmt, line, source, kind, badge) => { const s = src[source]; return {id, label, value, fmt, line, source, kind: kind || s.kind, badge: badge || s.badge}; };
  const wavg = (rows, tot) => tot ? rows.reduce((a, r) => a + r.gpus * r.tps, 0) / tot : 0;
  const tpsF = wavg(S.frontier_rows, S.frontier_gpus), tpsO = wavg(S.open_rows, S.open_gpus);
  const rent_sc = {
    key: "rent", letter: "A", title: "Rent the GPUs out", short: "Rent", colour: "#2a78d6",
    what: "Build the site, rent every GPU-hour to tenants at market rates and run the building.",
    drivers: [
      driver("gpus", "Number of GPUs", gpus, "int", `${n0(gpus)} GB300 GPUs in ${n0(racks)} NVL72 racks`, "gpus"),
      driver("rate", "Average rental price per hour per GPU", Rn.rate_avg, "usd2", `$${f2(Rn.rate_near)} in year 1, $${f2(Rn.rate_path[Rn.rate_path.length - 1])} in year ${life}`, "rent_price"),
      driver("hours", "Hours per year", HOURS, "int", "365 days x 24 hours", "hours"),
      driver("util", "Utilisation rate", Rn.util, "pct0", "share of GPU-hours sold", "rent_util"),
      driver("gpu_life", "Lifetime of GPUs", dep.compute_life, "years", `straight-line on $${B1(dep.compute_cost)} of GPUs and racks`, "gpu_life"),
      driver("shell_life", "Lifetime of shell", dep.shell_life, "years", `straight-line on $${B1(dep.shell_cost)} of shell and M&E`, "shell_life"),
    ],
    rows: [[{box: "gpus"}, {op: "x"}, {box: "rate"}, {op: "x"}, {box: "hours"}, {op: "x"}, {box: "util"}, {op: "="}, {result: {label: "Rental revenue per year", value: Rn.revenue, fmt: "usdB"}}]],
    dep_inputs: ["gpu_life", "shell_life"], ladder: ladder(Rn, Rn.util), streams: [{label: "Rent", value: Rn.revenue, colour: "#2a78d6"}],
    extra: {rate_path: Rn.rate_path, rate_near: Rn.rate_near, rate: Rn.rate, rate_avg: Rn.rate_avg, spot_n: nearOpt.n || 0, contract_n: contract.n, near_label: nearLabel, basis_label: rentBasisLabel,
      sd_b200: (idx["Silicon Data|B200"] || {}).rate, ornn_b200: (idx["Ornn|B200"] || {}).rate},
  };
  const tokRes = sc => ({label: "Tokens per year", value: sc.tokens_yr, fmt: "tokens", mid: true});
  const lab_sc = {
    key: "lab", letter: "B", title: "Serve tokens as a frontier lab", short: "Serve Lab", colour: "#eb6834",
    what: "Own the site and sell tokens: Anthropic's models where the work needs frontier intelligence, open-weight models for the rest.",
    drivers: [
      driver("gpus", "Number of chips", gpus, "int", `${n0(gpus)} GB300 GPUs`, "gpus"),
      driver("pct_inf", "% inference chips", 1 - S.training_share, "pct0", `${r0(S.training_share)}% of the fleet given to training`, "pct_inference"),
      driver("pct_closed", "% closed-weight tokens", S.closed_share, "pct1", `${pc(S.closed_share, 0)} closed at $${f2(S.frontier_blended_per_m_out)}/M, ${pc(1 - S.closed_share, 0)} open at $${f2(S.open_blended_per_m_out)}/M`, "pct_closed"),
      driver("tps", "Tokens per second per chip", S.eff_tps, "int", `closed models ~${n0(tpsF)}, open models ~${n0(tpsO)} tok/s per chip`, "tps_lab"),
      driver("util", "Token utilisation", S.util, "pct0", "share of chip-seconds producing billable tokens", "serve_util"),
      driver("price", "Token price", S.blended_per_m_out, "usd2m", `per M output tokens, input billed at the request ratio; blend of $${f2(S.frontier_blended_per_m_out)} closed and $${f2(S.open_blended_per_m_out)} open`, "price_lab"),
      driver("seconds", "Seconds per year", SECONDS, "int", "365 x 24 x 3,600", "seconds"),
    ],
    rows: [[{box: "gpus"}, {op: "x"}, {box: "pct_inf"}, {op: "x"}, {box: "tps"}, {op: "x"}, {box: "util"}, {op: "x"}, {box: "seconds"}, {op: "="}, {result: tokRes(S)}],
           [{result: tokRes(S)}, {op: "x"}, {box: "price"}, {op: "="}, {result: {label: "Token revenue per year", value: S.revenue, fmt: "usdB"}}]],
    modifier: "pct_closed", ladder: ladder(S, S.util),
    streams: [{label: "Closed-weight tokens (Anthropic models)", value: S.frontier_revenue_hr * HOURS, colour: "#eb6834"}, {label: "Open-weight tokens", value: S.open_revenue_hr * HOURS, colour: "#1baf7a"}],
    extra: {frontier_gpus: S.frontier_gpus, open_gpus: S.open_gpus, closed_share: S.closed_share, frontier_rev_per_gpu_hr: S.frontier_rev_per_gpu_hr, open_rev_per_gpu_hr: S.open_rev_per_gpu_hr},
  };
  const open_sc = {
    key: "open", letter: "D", title: "Serve open-weight tokens only", short: "Serve Open Weight", colour: "#1baf7a",
    what: "Own the site and sell tokens from open-weight models only, at today's market prices for those models.",
    drivers: [
      driver("gpus", "Number of chips", gpus, "int", `${n0(gpus)} GB300 GPUs, all serving`, "gpus"),
      driver("tps", "Tokens per second per chip", Dn.eff_tps, "int", `${Dn.n_open_models} open models: ` + Dn.open_rows.filter(r => r.share > 0).map(r => `${r.name} ${n0(r.tps)}`).join(", "), "tps_open"),
      driver("util", "Token utilisation", Dn.util, "pct0", "share of chip-seconds producing billable tokens", "serve_util"),
      driver("price", "Token price", Dn.blended_per_m_out, "usd2m", `per M output tokens all-in; output alone $${f2(Dn.open_p_out)}/M`, "price_open"),
      driver("seconds", "Seconds per year", SECONDS, "int", "365 x 24 x 3,600", "seconds"),

    rows: [[{box: "gpus"}, {op: "x"}, {box: "tps"}, {op: "x"}, {box: "util"}, {op: "x"}, {box: "seconds"}, {op: "="}, {result: tokRes(Dn)}],
           [{result: tokRes(Dn)}, {op: "x"}, {box: "price"}, {op: "="}, {result: {label: "Token revenue per year", value: Dn.revenue, fmt: "usdB"}}]],
    ladder: ladder(Dn, Dn.util), streams: [{label: "Open-weight tokens", value: Dn.revenue, colour: "#1baf7a"}],
  };
  const avg = xs => xs.reduce((a, b) => a + b, 0) / xs.length;
  const rentBlock = avg(W.rent_block_path), tokBlock = avg(W.token_share_path), openBlock = avg(W.open_rev_path);
  const aws_sc = {
    key: "aws", letter: "F", title: "Serve as AWS: landlord to Anthropic", short: "Serve AWS", colour: "#4a3aa7",
    what: "Own the site, rent the block Anthropic's models need to Anthropic (rent plus a share of their token revenue) and serve open-weight tokens on the rest.",
    drivers: [
      driver("gpus", "Number of chips", gpus, "int", `${n0(gpus)} GB300 GPUs`, "gpus"),
      driver("pct_rented", "% rented out to Anthropic", W.frontier_gpus / gpus, "pct1", `${n0(W.frontier_gpus)} GPUs at $${f2(Rn.rate_avg)}/GPU-hr average, ${r0(W.rent_util)}% rental utilisation`, "pct_rented"),
      driver("rev_share", "Anthropic revenue share", W.rev_share, "pct0", `of the $${B1(W.frontier_token_rev_hr * HOURS)} Anthropic's models earn on the block`, "rev_share"),
      driver("pct_closed", "% closed-weight tokens", W.closed_share, "pct1", "same task framework as the lab scenario", "pct_closed"),
      driver("tps", "Tokens per second per chip", S.eff_tps, "int", `closed ~${n0(tpsF)} on the rented block, open ~${n0(tpsO)} on AWS's own chips`, "tps_lab"),
      driver("util", "Token utilisation", W.util, "pct0", "share of chip-seconds producing billable tokens", "serve_util"),
      driver("price", "Token price", S.blended_per_m_out, "usd2m", `closed $${f2(S.frontier_blended_per_m_out)}/M (Anthropic's revenue, shared), open $${f2(S.open_blended_per_m_out)}/M (AWS's own)`, "price_lab"),
      driver("seconds", "Seconds per year", SECONDS, "int", "365 x 24 x 3,600", "seconds"),
    ],
    rows: [[{box: "gpus"}, {op: "."}, {box: "pct_rented"}, {op: "."}, {box: "rev_share"}, {op: "."}, {box: "pct_closed"}, {op: "."}, {box: "tps"}],
           [{box: "util"}, {op: "."}, {box: "price"}, {op: "."}, {box: "seconds"}, {op: "="}, {result: {label: "AWS revenue per year", value: W.revenue, fmt: "usdB", sub: "three streams, below"}}]],
    ladder: ladder(W, W.util),
    streams: [{label: `Rent from Anthropic on ${n0(W.frontier_gpus)} GPUs`, value: rentBlock, colour: "#2a78d6", formula: `${n0(W.frontier_gpus)} GPUs x $${f2(Rn.rate_avg)} x 8,760 h x ${r0(W.rent_util)}%`},
              {label: `${r0(W.rev_share)}% share of Anthropic's token revenue`, value: tokBlock, colour: "#eb6834", formula: `${r0(W.rev_share)}% x $${B1(W.frontier_token_rev_hr * HOURS)}`},
              {label: `Open-weight tokens on AWS's ${n0(W.open_gpus)} GPUs`, value: openBlock, colour: "#1baf7a", formula: `${n0(W.open_gpus)} GPUs x ${n0(tpsO)} tok/s x ${r0(W.util)}% x 31.5M s x $${f2(S.open_blended_per_m_out)}/M`}],
    extra: {frontier_gpus: W.frontier_gpus, open_gpus: W.open_gpus, rev_share: W.rev_share, rent_util: W.rent_util, rate_avg: Rn.rate_avg, anthropic_token_rev: W.frontier_token_rev_hr * HOURS},
  };
  const scenarios = [rent_sc, lab_sc, open_sc, aws_sc];
  for (const sc of scenarios) { const n = {market: 0, assumption: 0, fixed: 0}; for (const d of sc.drivers) n[d.kind]++; sc.counts = n; }
  return {
    built_at: I.built_at,
    fleet: {gpus, racks, gpus_per_rack: F.gpus_per_rack, site_mw: F.site_mw, it_mw: F.it_mw, pue: F.pue, kw_per_gpu: F.kw_per_gpu, kw_per_rack: P.kw_per_rack.value, chip: F.chip, chip_label: F.chip_label,
      capex, capex_per_gpu: F.capex_per_gpu, gpu_cost: F.gpu_cost, rack_cost: F.rack_cost_usd, power_price_mwh: dials.power_price, other_opex: dials.other_opex, mastersheet: msLabel, mastersheet_found: !!ms.found},
    areas,
    finance: {horizon: life, compute_life: dep.compute_life, shell_life: dep.shell_life, dep_avg: dep.avg, compute_cost: dep.compute_cost, shell_cost: dep.shell_cost, dep_compute: dep.compute_path[0], dep_shell: dep.shell_path[0],
      terminal: dep.terminal, rent_decline: dials.rent_decline, token_decline: dials.token_decline},
    scenarios, sources: src,
    freshness: {openrouter: OR.read_on, openrouter_week: String(OR.week_date || "").slice(0, 10), inferencex: I.throughput_meta.read_on, inferencex_newest_run: I.throughput_meta.newest_run, rental: I.rental_meta.read_on,
      lab_prices: I.lab_prices_meta.read_on, token_index: (tokLatest.llm || [null, null])[1], mastersheet: msLabel},
    also: {openai: {roic: R.serves.openai.roic, irr: R.serves.openai.irr, rev_per_gpu_hr: R.serves.openai.rev_per_gpu_hr}, open_peak: {roic: R.serve_open_peak.roic, irr: R.serve_open_peak.irr, rev_per_gpu_hr: R.serve_open_peak.rev_per_gpu_hr}},
  };
}

/* The presentation layer. Everything it shows is in DATA (written by build_infographic.py from the engine one folder up). */
(function () {
  // ---------- state: the page recomputes itself from INPUTS at the dials it is given
  const DEFAULTS = defaultDials(INPUTS);
  const computeData = d => assembleData(INPUTS, compute(INPUTS, d), d, EXTRA);
  let DIALS = Object.assign({}, DEFAULTS);
  let D = computeData(DIALS);
  let SC = D.scenarios;
  let byKey = Object.fromEntries(SC.map(s => [s.key, s]));
  const ORDER = ["build", ...SC.map(s => s.key), "summary"];
  const $ = (sel, el) => (el || document).querySelector(sel);
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const k in (attrs || {})) {
      if (k === "class") n.className = attrs[k];
      else if (k === "style") n.style.cssText = attrs[k];
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else if (k === "html") n.innerHTML = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    for (const c of kids.flat()) if (c !== null && c !== undefined) n.append(c.nodeType ? c : document.createTextNode(String(c)));
    return n;
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

  // ---------- formatting
  const B = v => (Math.abs(v) >= 1e9 ? "$" + (v / 1e9).toFixed(Math.abs(v) >= 1e10 ? 1 : 2) + "B" : "$" + (v / 1e6).toFixed(0) + "M");
  const pct = (v, d) => (100 * v).toFixed(d === undefined ? 1 : d) + "%";
  const int = v => Math.round(v).toLocaleString("en-US");
  const fmt = (v, f) => {
    switch (f) {
      case "int": return int(v);
      case "usd2": return "$" + v.toFixed(2);
      case "usd2m": return "$" + v.toFixed(2);
      case "pct0": return pct(v, 0);
      case "pct1": return pct(v, 1);
      case "years": return v % 1 ? v.toFixed(1) : String(v);
      case "usdB": return B(v);
      case "tokens": return (v / 1e15).toFixed(2) + " quadrillion";
      default: return String(v);
    }
  };
  const unit = f => ({usd2: "/GPU-hr", usd2m: "/M tokens", years: "years", tokens: ""}[f] || "");
  const signed = v => (v >= 0 ? "" : "−") + Math.abs(100 * v).toFixed(1) + "%";

  // ---------- navigation
  const main = $("#main"), tabs = $("#tabs");
  let pages = {};
  let current = "build";
  function show(key, push, keepScroll) {
    if (!pages[key]) key = "build";
    current = key;
    for (const k in pages) pages[k].classList.toggle("on", k === key);
    for (const t of tabs.children) t.classList.toggle("on", t.dataset.key === key);
    if (push !== false) history.replaceState(null, "", "#" + key);
    if (!keepScroll) window.scrollTo({top: 0});
    if (key === "summary") drawSummaryCharts();
  }
  window.addEventListener("hashchange", () => show(location.hash.slice(1) || "build", false));
  document.addEventListener("keydown", e => {
    if ($("#mback").classList.contains("on")) { if (e.key === "Escape") closeModal(); return; }
    const i = ORDER.indexOf(location.hash.slice(1) || "build");
    if (e.key === "ArrowRight" || e.key === "PageDown") show(ORDER[Math.min(ORDER.length - 1, i + 1)]);
    if (e.key === "ArrowLeft" || e.key === "PageUp") show(ORDER[Math.max(0, i - 1)]);
  });
  function tab(key, label, colour, letter) {
    const t = el("button", {class: "tab", "data-key": key, style: colour ? "--c:" + colour : "", onclick: () => show(key)},
      colour ? el("span", {class: "dot"}) : null, letter ? el("b", {}, letter) : null, label);
    tabs.append(t);
  }
  tab("build", "The build");
  for (const s of SC) tab(s.key, s.short, s.colour, s.letter);
  tab("summary", "Summary");

  function navbtns(key) {
    const i = ORDER.indexOf(key);
    const prev = ORDER[i - 1], next = ORDER[i + 1];
    const name = k => k === "build" ? "The build" : k === "summary" ? "Summary" : byKey[k].letter + " · " + byKey[k].short;
    return el("div", {class: "navbtns"},
      prev ? el("button", {onclick: () => show(prev)}, "← " + name(prev)) : el("span"),
      next ? el("button", {onclick: () => show(next)}, name(next) + " →") : el("span"));
  }

  // ---------- modal (source panels)
  const mback = $("#mback"), modal = $("#modal");
  let openKey = null;
  function closeModal() { mback.classList.remove("on"); openKey = null; }
  mback.addEventListener("click", e => { if (e.target === mback) closeModal(); });
  function openSource(key, colour) {
    const s = D.sources[key];
    if (!s) return;
    const refresh = mback.classList.contains("on") && openKey === key;
    const keepScroll = refresh ? modal.scrollTop : 0;
    openKey = key;
    modal.innerHTML = "";
    modal.append(
      el("button", {class: "x", onclick: closeModal, "aria-label": "Close"}, "×"),
      el("span", {class: "pill " + s.kind}, el("i"), s.badge),
      el("h2", {}, s.title),
      el("p", {class: "sum"}, s.summary));
    for (const t of s.tables || []) {
      if (!t.rows.length) continue;
      modal.append(el("h4", {}, t.caption));
      const urlCol = t.columns.indexOf("url");
      const head = el("tr", {}, t.columns.filter((c, i) => i !== urlCol).map((c, i) => el("th", {class: i > 0 && /\$|%|GPUs|tok|Value|Share|n$/.test(c) ? "r" : ""}, c)), urlCol >= 0 ? el("th", {}, "Source") : null);
      const body = t.rows.map(r => el("tr", {}, r.map((c, i) => i === urlCol ? null : el("td", {class: i > 0 && /^\$|%$|^[\d,\.]+$|^\d+ yr/.test(String(c)) ? "r" : ""}, c === null ? "" : c)),
        urlCol >= 0 ? el("td", {}, r[urlCol] ? el("a", {class: "src", href: r[urlCol], target: "_blank", rel: "noopener"}, "↗") : "") : null));
      modal.append(el("table", {}, el("thead", {}, head), el("tbody", {}, body)));
    }
    if (s.links && s.links.length) modal.append(el("div", {class: "links"}, s.links.map(l => el("a", {href: l.url, target: "_blank", rel: "noopener"}, l.label + " ↗"))));
    if (s.note) modal.append(el("p", {class: "note"}, s.note));
    mback.classList.add("on");
    modal.scrollTop = keepScroll;
  }

  // ---------- tooltip
  const tip = $("#tip");
  function tipOn(html) { tip.innerHTML = html; tip.style.display = "block"; }
  function tipMove(e) { tip.style.left = Math.min(window.innerWidth - 300, e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px"; }
  function tipOff() { tip.style.display = "none"; }

  // ---------- driver boxes
  function box(d, sc) {
    const v = fmt(d.value, d.fmt), u = unit(d.fmt);
    const b = el("button", {class: "box " + d.kind, onclick: () => openSource(d.source, sc.colour), title: "Click for the sources"},
      el("div", {class: "badge-row"}, el("span", {class: "pill " + d.kind}, el("i"), d.badge)),
      el("div", {class: "lbl"}, d.label),
      el("div", {class: "val num"}, v, u ? el("small", {}, u) : null),
      el("div", {class: "line"}, d.line));
    return b;
  }
  const op = s => el("div", {class: "op" + (s === "=" ? " eq" : "")}, s);
  const result = (label, value, f, mid, sub) => el("div", {class: "result" + (mid ? " mid" : "")}, el("div", {class: "lbl"}, label), el("div", {class: "val num"}, fmt(value, f)), sub ? el("div", {class: "sub"}, sub) : null);

  // ---------- scenario page
  function scenarioPage(sc) {
    const L = sc.ladder, drv = Object.fromEntries(sc.drivers.map(d => [d.id, d]));
    const pg = el("section", {class: "page", id: "p_" + sc.key, style: "--c:" + sc.colour});
    // header
    pg.append(el("div", {class: "phead"},
      el("div", {class: "t"},
        el("h1", {}, el("span", {class: "letter"}, sc.letter), sc.title),
        el("p", {class: "what"}, sc.what),
        el("div", {class: "stats"},
          el("div", {class: "stat"}, el("div", {class: "l"}, "Revenue / yr"), el("div", {class: "v num"}, B(L.revenue))),
          el("div", {class: "stat"}, el("div", {class: "l"}, "EBITDA / yr"), el("div", {class: "v num"}, B(L.ebitda))),
          el("div", {class: "stat"}, el("div", {class: "l"}, "Revenue per GPU-hour"), el("div", {class: "v num"}, "$" + L.rev_per_gpu_hr.toFixed(2))),
          el("div", {class: "stat"}, el("div", {class: "l"}, "Payback"), el("div", {class: "v num"}, L.payback_years ? L.payback_years.toFixed(1) + " yrs" : "never")))),
      el("div", {class: "heroes"},
        el("div", {class: "hero"}, el("div", {class: "l"}, "ROIC"), el("div", {class: "v num"}, signed(L.roic)), el("div", {class: "s"}, "(EBITDA − depreciation) ÷ cost to build, " + D.finance.horizon + "-yr average · year 1: " + signed(L.roic_y1))),
        el("div", {class: "hero"}, el("div", {class: "l"}, "IRR"), el("div", {class: "v num"}, L.irr === null ? "n/a" : signed(L.irr)), el("div", {class: "s"}, "pre-tax, " + D.finance.horizon + "-year cash flows" + (L.terminal ? " + book value at exit" : ", no terminal value"))))));
    // driver chain: one or two rows of linked boxes, laid out explicitly so nothing wraps mid-formula
    const chainBlock = el("div", {class: "block"}, el("h3", {}, "What drives the revenue \u00b7 click any box for its sources"));
    const OPS = {x: "\u00d7", "=": "=", ".": "\u00b7", "+": "+"};
    for (const row of sc.rows) {
      const chain = el("div", {class: "chain" + (row.length <= 5 ? " short" : "")});
      for (const it of row) {
        if (it.box) chain.append(box(drv[it.box], sc));
        else if (it.op) chain.append(op(OPS[it.op] || it.op));
        else if (it.result) chain.append(result(it.result.label, it.result.value, it.result.fmt, it.result.mid, it.result.sub));
      }
      chainBlock.append(chain);
    }
    if (sc.modifier) {
      const m = drv[sc.modifier];
      chainBlock.append(el("div", {class: "modrow"}, box(m, sc),
        el("div", {class: "arrow"}, "sets the closed / open blend inside \u201c" + drv.tps.label + "\u201d and \u201c" + drv.price.label + "\u201d")));
    }
    if (sc.dep_inputs) {
      const row = el("div", {class: "modrow"});
      row.append(box(drv[sc.dep_inputs[0]], sc), op("+"), box(drv[sc.dep_inputs[1]], sc), op("="),
        result("Depreciation per year", D.finance.dep_avg, "usdB", true),
        el("div", {class: "arrow"}, "$" + (D.finance.compute_cost / 1e9).toFixed(1) + "B of GPUs and racks over " + D.finance.compute_life + " years + $" + (D.finance.shell_cost / 1e9).toFixed(1) + "B of shell over " + D.finance.shell_life + " years"));
      chainBlock.append(row);
    }
    pg.append(chainBlock);
    // ladder + streams
    const two = el("div", {class: "two"});
    two.append(ladderBlock(sc), streamsBlock(sc));
    pg.append(two, navbtns(sc.key));
    return pg;
  }

  function ladderBlock(sc) {
    const L = sc.ladder, mx = L.revenue;
    const sB = v => (v < 0 ? "−" : "") + B(Math.abs(v));
    const w = v => Math.max(2, 100 * Math.abs(v) / mx) + "%";
    const row = (k, v, cls, opts) => el("div", {class: "r " + (cls || "")},
      el("div", {class: "k"}, k),
      el("div", {}, opts === "none" ? null : el("span", {class: "bar " + (opts || ""), style: "width:" + w(v)})),
      el("div", {class: "v num"}, sB(v)));
    const lad = el("div", {class: "ladder"},
      row("Revenue per year (" + D.finance.horizon + "-yr average)", L.revenue, "tot"),
      row("− Power at " + pct(L.util, 0) + " utilisation, $" + D.fleet.power_price_mwh + "/MWh", -L.power, "", "cost"),
      row("− Other operating costs", -L.other, "", "cost"),
      row("= EBITDA", L.ebitda, "tot"),
      row("− Depreciation (GPUs " + D.finance.compute_life + " yrs, shell " + D.finance.shell_life + " yrs)", -L.dep, "", "cost"),
      row("= Operating profit", L.op_profit, "tot", L.op_profit < 0 ? "neg" : ""),
      row("÷ Cost to build", L.capex, "last", "none"),
      el("div", {class: "note"}, "ROIC " + signed(L.roic) + " = " + sB(L.op_profit) + " ÷ " + B(L.capex) + ". Power and other operating costs are the mastersheet's site figures (assumptions); depreciation follows the two lifetimes."));
    const blk = el("div", {class: "block"}, el("h3", {}, "From revenue to return"), lad);
    // cash flows
    const cf = el("div", {class: "cf"});
    cf.append(el("h3", {}, "Cash flows behind the IRR (" + (sc.ladder.irr === null ? "n/a" : signed(sc.ladder.irr)) + ")"));
    cf.append(cashflowSvg(sc));
    blk.append(cf);
    return blk;
  }

  function cashflowSvg(sc) {
    const F = sc.ladder.flows, W = 600, H = 170, padL = 8, padR = 8, top = 22, bot = 40;
    const mx = Math.max(...F.map(Math.abs));
    const y0 = top + (H - top - bot) * (mx / (2 * mx));
    const sy = (H - top - bot) / (2 * mx);
    const n = F.length, slot = (W - padL - padR) / n, bw = Math.min(24, slot * 0.5);
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    let g = `<line x1="${padL}" x2="${W - padR}" y1="${y0}" y2="${y0}" stroke="#d2d1cc" stroke-width="1"/>`;
    F.forEach((v, i) => {
      const x = padL + slot * i + slot / 2 - bw / 2, h = Math.abs(v) * sy;
      const y = v >= 0 ? y0 - h : y0;
      const c = v >= 0 ? sc.colour : "#e34948";
      const r = 4;
      const path = v >= 0
        ? `M${x},${y0} V${y + r} a${r},${r} 0 0 1 ${r},-${r} H${x + bw - r} a${r},${r} 0 0 1 ${r},${r} V${y0} Z`
        : `M${x},${y0} V${y0 + h - r} a${r},${r} 0 0 0 ${r},${r} H${x + bw - r} a${r},${r} 0 0 0 ${r},-${r} V${y0} Z`;
      g += `<path d="${path}" fill="${c}"><title>${i === 0 ? "Year 0: cost to build" : "Year " + i + ": EBITDA" + (i === n - 1 && sc.ladder.terminal ? " + book value" : "")} ${B(v)}</title></path>`;
      g += `<text x="${x + bw / 2}" y="${v >= 0 ? y - 5 : y0 + h + 14}" text-anchor="middle" font-size="11" fill="#52514e">${(v < 0 ? "−" : "") + B(Math.abs(v))}</text>`;
      g += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#8a8985">${i === 0 ? "build" : "yr " + i}</text>`;
    });
    svg.innerHTML = g;
    return svg;
  }

  function ratePathSvg(sc) {
    const P = sc.extra.rate_path, W = 520, H = 170, left = 44, right = 16, top = 14, bot = 28;
    const refs = [["Silicon Data B200", sc.extra.sd_b200], ["Ornn B200", sc.extra.ornn_b200]].filter(r => r[1]);
    const mx = Math.max(...P, ...refs.map(r => r[1])) * 1.15;
    const n = P.length, slot = (W - left - right) / n, bw = Math.min(24, slot * 0.5);
    const Y = v => top + (H - top - bot) * (1 - v / mx);
    let g = "";
    for (let v = 0; v <= mx; v += 2) g += `<line x1="${left}" x2="${W - right}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === 0 ? "#8a8985" : "#e4e3df"}"/><text x="${left - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10.5" fill="#8a8985">$${v}</text>`;
    P.forEach((v, i) => {
      const x = left + slot * i + slot / 2 - bw / 2, y = Y(v);
      g += `<path d="M${x},${Y(0)} V${y + 4} a4,4 0 0 1 4,-4 H${x + bw - 4} a4,4 0 0 1 4,4 V${Y(0)} Z" fill="${sc.colour}"><title>Year ${i + 1}: $${v.toFixed(2)} per GPU-hour</title></path>`;
      g += `<text x="${x + bw / 2}" y="${y - 5}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0b0b0b">$${v.toFixed(2)}</text>`;
      g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#8a8985">yr ${i + 1}</text>`;
    });
    refs.forEach(([lab, v]) => { g += `<line x1="${left}" x2="${W - right}" y1="${Y(v)}" y2="${Y(v)}" stroke="#52514e" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W - right}" y="${Y(v) - 4}" text-anchor="end" font-size="10.5" fill="#52514e">${lab} $${v.toFixed(2)}</text>`; });
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.style.width = "100%"; svg.style.height = "auto"; svg.style.display = "block";
    svg.innerHTML = g;
    return svg;
  }

  function streamsBlock(sc) {
    const tot = sc.streams.reduce((a, s) => a + s.value, 0);
    const blk = el("div", {class: "block"}, el("h3", {}, sc.streams.length > 1 ? "Where the revenue comes from" : "Revenue"));
    const list = el("div", {class: "streams"});
    for (const s of sc.streams) {
      list.append(el("div", {class: "stream", style: "--sc:" + s.colour},
        el("div", {class: "l"}, el("i"), s.label),
        el("div", {class: "v num"}, B(s.value) + (sc.streams.length > 1 ? "  · " + pct(s.value / tot, 0) : "")),
        el("div", {class: "track"}, el("i", {style: "width:" + (100 * s.value / tot) + "%"})),
        s.formula ? el("div", {class: "f"}, s.formula) : null));
    }
    blk.append(list);
    // the input mix
    const c = sc.counts;
    blk.append(el("h3", {style: "margin-top:20px"}, "The inputs behind this page"));
    blk.append(el("div", {class: "leg", style: "gap:8px"},
      el("span", {class: "pill market"}, el("i"), c.market + " market"),
      el("span", {class: "pill assumption"}, el("i"), c.assumption + " assumption" + (c.assumption === 1 ? "" : "s")),
      el("span", {class: "pill fixed"}, el("i"), c.fixed + " fixed")));
    const notes = {
      rent: "Rent needs the fewest assumptions: the rate is what tenants pay today and what the disclosed multi-year deals cleared at. The return hinges on utilisation and on how long the kit is written off over.",
      lab: "Serving as a lab has the highest return and the most assumptions: how much of the work needs frontier models, how many tokens a chip really produces in production, and how busy the fleet is. Prices are market prices.",
      open: "Open-weight prices are set by a competitive host market, so a GPU-hour is made to earn only the year-1 rental rate plus a renter's margin: the realised throughput is backed out of the price, which is why it is an assumption.",
      aws: "AWS earns like a landlord on the Anthropic block (rent plus a share of the token dollars) and like a host on the rest. The revenue share and the size of the block are the assumptions that matter.",
    };
    blk.append(el("p", {class: "small muted", style: "margin-top:10px"}, notes[sc.key] || ""));
    if (sc.key === "lab" && sc.extra) {
      blk.append(el("p", {class: "tiny", style: "margin-top:10px"},
        int(sc.extra.frontier_gpus) + " GPUs serve closed-weight tokens (earning $" + sc.extra.frontier_rev_per_gpu_hr.toFixed(2) + " per busy GPU-hour); " +
        int(sc.extra.open_gpus) + " serve open-weight tokens ($" + sc.extra.open_rev_per_gpu_hr.toFixed(2) + ")."));
    }
    if (sc.key === "aws" && sc.extra) {
      blk.append(el("p", {class: "tiny", style: "margin-top:10px"},
        "Anthropic's models earn " + B(sc.extra.anthropic_token_rev) + " a year on the rented block; AWS keeps the rent plus " + pct(sc.extra.rev_share, 0) + " of that, and all of the open-weight revenue on its own chips."));
    }
    if (sc.key === "rent" && sc.extra) {
      blk.append(el("h3", {style: "margin-top:20px"}, "The rate path behind the $" + sc.extra.rate_avg.toFixed(2) + " average"));
      blk.append(ratePathSvg(sc));
      blk.append(el("div", {class: "cap small muted"}, "Year 1 at " + sc.extra.near_label.charAt(0).toLowerCase() + sc.extra.near_label.slice(1) + " ($" + sc.extra.rate_near.toFixed(2) + ", " + sc.extra.spot_n + " rates), converging to the contract median ($" + sc.extra.rate + ", " + sc.extra.contract_n + " disclosed deals). Dashed: today's B200 indices, Silicon Data $" + (sc.extra.sd_b200 || 0).toFixed(2) + " and Ornn $" + (sc.extra.ornn_b200 || 0).toFixed(2) + " (older part, reference only)."));
    }
    return blk;
  }

  // ---------- build page
  function buildPage() {
    const F = D.fleet, A = D.areas;
    const pg = el("section", {class: "page", id: "p_build"});
    pg.append(el("div", {class: "phead"},
      el("div", {class: "t"},
        el("h1", {}, "What it costs to build 1 GW of Blackwell"),
        el("p", {class: "what"}, "A " + int(F.site_mw) + " MW site filled with " + F.chip_label + " racks: " + int(F.gpus) + " GPUs in " + int(F.racks) + " racks. The same building is then used four ways, on the following pages."))));
    const grid = el("div", {class: "buildgrid"});
    const dc = el("div", {class: "block dc", style: "margin:0"}, el("h3", {}, "The site, and where the money goes"));
    dc.append(dcSvg());
    grid.append(dc);
    const tot = el("div", {class: "total"},
      el("div", {},
        el("div", {class: "l"}, "Total cost to build"),
        el("div", {class: "v num"}, "$" + (F.capex / 1e9).toFixed(1) + "B"),
        el("div", {class: "s"}, "$" + int(F.capex_per_gpu) + " per GPU, all-in · " + (F.mastersheet_found ? "AI mastersheet.xlsx, sheet GB300" : "fallback values (mastersheet not found)"))),
      el("div", {class: "facts"},
        el("div", {}, el("div", {class: "k"}, "GPUs"), el("div", {class: "n num"}, int(F.gpus))),
        el("div", {}, el("div", {class: "k"}, "NVL72 racks"), el("div", {class: "n num"}, int(F.racks))),
        el("div", {}, el("div", {class: "k"}, "Facility power"), el("div", {class: "n num"}, int(F.site_mw) + " MW")),

  function drawSummaryCharts() {
    drawSummaryChart("ch_returns", host => {
      // two small multiples on one axis each: ROIC and IRR by scenario, horizontal bars
      const W = 640, rowH = 34, top = 30, left = 150, right = 70, H = top + SC.length * rowH + 16;
      const draw = (metric, label) => {
        const vals = SC.map(s => s.ladder[metric] === null ? 0 : s.ladder[metric]);
        const mn = Math.min(0, ...vals), mx = Math.max(0.05, ...vals);
        const sx = (W - left - right) / (mx - mn);
        const x0 = left + (0 - mn) * sx;
        let g = `<text x="${left}" y="16" font-size="12.5" font-weight="600" fill="#52514e">${label}</text>`;
        // gridlines at clean steps
        const step = mx - mn > 0.6 ? 0.2 : 0.1;
        for (let v = Math.ceil(mn / step) * step; v <= mx + 1e-9; v += step) {
          const x = left + (v - mn) * sx;
          g += `<line x1="${x}" x2="${x}" y1="${top - 6}" y2="${H - 14}" stroke="${Math.abs(v) < 1e-9 ? "#8a8985" : "#e4e3df"}" stroke-width="1"/><text x="${x}" y="${H - 2}" text-anchor="middle" font-size="10.5" fill="#8a8985">${Math.round(100 * v)}%</text>`;
        }
        SC.forEach((s, i) => {
          const v = vals[i], y = top + i * rowH + 6, h = 22, r = 4;
          const x1 = Math.min(x0, x0 + v * sx), w = Math.max(2, Math.abs(v) * sx);
          const path = v >= 0
            ? `M${x0},${y} H${x0 + w - r} a${r},${r} 0 0 1 ${r},${r} V${y + h - r} a${r},${r} 0 0 1 -${r},${r} H${x0} Z`
            : `M${x0},${y} H${x1 + r} a${r},${r} 0 0 0 -${r},${r} V${y + h - r} a${r},${r} 0 0 0 ${r},${r} H${x0} Z`;
          g += `<text x="${left - 10}" y="${y + 15}" text-anchor="end" font-size="12.5" fill="#0b0b0b">${s.letter} · ${s.short}</text>`;
          g += `<path d="${path}" fill="${s.colour}" data-tip="${esc(s.title)}: ${label} ${signed(v)}"/>`;
          g += `<text x="${(v >= 0 ? x0 + w : x0) + 6}" y="${y + 15}" text-anchor="start" font-size="12.5" font-weight="600" fill="#0b0b0b">${signed(v)}</text>`;
        });
        return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
      };

      const rows = SC.map(s => ({s, rev: s.ladder.revenue / (hrs * s.ladder.util), cost: (s.ladder.power + s.ladder.other + s.ladder.dep) / (hrs * s.ladder.util)}));
      const W = 640, rowH = 54, top = 24, left = 150, right = 80, H = top + SC.length * rowH + 20;
      const mx = Math.max(...rows.map(r => Math.max(r.rev, r.cost))) * 1.08, sx = (W - left - right) / mx;

      rows.forEach((r, i) => {

        const bar = (v, yy, c, t) => `<path d="M${left},${yy} H${left + v * sx - 4} a4,4 0 0 1 4,4 V${yy + 14} a4,4 0 0 1 -4,4 H${left} Z" fill="${c}" data-tip="${t}"/>`;
        g += `<text x="${left - 10}" y="${y + 22}" text-anchor="end" font-size="12.5" fill="#0b0b0b">${r.s.letter} · ${r.s.short}</text>`;
        g += bar(r.rev, y + 4, r.s.colour, esc(r.s.title) + ": earns $" + r.rev.toFixed(2) + " per busy GPU-hour") + `<text x="${left + r.rev * sx + 6}" y="${y + 17}" font-size="12" font-weight="600" fill="#0b0b0b">$${r.rev.toFixed(2)}</text>`;
        g += bar(r.cost, y + 24, "#c9c8c2", "costs $" + r.cost.toFixed(2) + " per busy GPU-hour (power, other costs, depreciation)") + `<text x="${left + r.cost * sx + 6}" y="${y + 37}" font-size="12" fill="#52514e">$${r.cost.toFixed(2)} cost</text>`;
      });
      host.insertAdjacentHTML("beforeend", `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`);
      host.append(el("div", {class: "leg"}, el("span", {}, el("i", {class: "sq", style: "--sc:#0b0b0b"}), "revenue per busy GPU-hour (scenario colour)"), el("span", {}, el("i", {class: "sq", style: "--sc:#c9c8c2"}), "cost per busy GPU-hour: power + other costs + depreciation")));
      host.append(el("div", {class: "cap"}, "Rent sells a GPU-hour for less than the site's all-in cost of producing one; serving prices the same hour by the tokens it yields."));

      const series = SC.map(s => { let acc = 0; return {s, pts: s.ladder.flows.map(f => (acc += f))}; });
